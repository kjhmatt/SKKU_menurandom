<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>율천동 메뉴랜덤</title>
  <meta name="description" content="성균관대학교 자연과학캠퍼스(율천동) 카카오맵 평점 3.5 이상 맛집 랜덤 추천 및 3D 도보 내비게이션">

  <!-- 도시락 모양 Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍱</text></svg>">

  <!-- Pretendard Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 음식 이모지 비 배경 -->
  <canvas id="bg-canvas"></canvas>

  <!-- 3D 지도 컨테이너 -->
  <div id="map-container"></div>

  <!-- 메인 글래스 카드 래퍼 -->
  <div id="container-wrap" class="glass-container-wrap">
    <div id="main-card" class="glass-card">

      <!-- 초기 중앙 박스 -->
      <div class="card-header-initial">
        <h1 class="card-title">율천동 메뉴랜덤</h1>
        <p class="card-subtitle">성균관대 자연과학캠퍼스 카카오맵 3.5+ 엄선 맛집</p>
      </div>

      <div class="initial-footer">
        <button id="start-btn" class="btn-recommend" aria-label="메뉴 추천 시작">
          <span>추천 시작</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- 스크립트 -->
  <script src="js/restaurants.js"></script>
  <script src="js/emoji-rain.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
